[www]
; User and group under which PHP-FPM processes will run
user = www-data
group = www-data

; Listens on all network interfaces, on port 9000
; This allows NGINX (in another container) to connect to PHP-FPM
listen = 0.0.0.0:9000

; Owner and group of the socket used by PHP-FPM (useful if using a socket file instead of a port)
listen.owner = www-data
listen.group = www-data

; PHP process management strategy: "dynamic" means PHP-FPM dynamically adjusts the number of processes based on the load
pm = dynamic

; Maximum number of child processes that can be started
pm.max_children = 5

; Number of processes started at boot
pm.start_servers = 2

; Minimum number of idle processes to keep (to respond quickly to a request)
pm.min_spare_servers = 1

; Maximum number of idle processes to keep (beyond this, they will be killed)
pm.max_spare_servers = 3