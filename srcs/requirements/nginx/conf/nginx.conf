# ----------------------------
# Block to manage connections
# ----------------------------
events {
    # Maximum number of simultaneous connections per worker
    worker_connections 1024;
}

# ----------------------------
# Main HTTP block
# ----------------------------
http {
    # Includes known MIME types to serve files correctly
    include /etc/nginx/mime.types;
    
    # Default type if the file has no known MIME type
    default_type application/octet-stream;

    # ----------------------------
    # Server configuration
    # ----------------------------
    server {
        # Listens on port 443 for HTTPS and enables HTTP/2
        listen 443 ssl http2;
        # Domain names this server will handle
        server_name dbajeux.42.fr www.dbajeux.42.fr;

        # Paths to the SSL certificate and its key
        ssl_certificate /etc/nginx/ssl/nginx.crt;
        ssl_certificate_key /etc/nginx/ssl/nginx.key;

        # Allowed TLS versions for security
        ssl_protocols TLSv1.2 TLSv1.3;

        # Root directory of the site files
        root /var/www/html;

        # Index files to serve by default if the URL is a directory
        index index.php index.html index.htm;

        # ----------------------------
        # Location for the site root
        # ----------------------------
        location / {
            # Tries to serve the requested file
            # otherwise redirects to index.php with arguments (WordPress)
            try_files $uri $uri/ /index.php?$args;
        }

        # ----------------------------
        # Location for PHP files
        # ----------------------------
        location ~ \.php$ {
            # Splits the script path and PATH_INFO (useful for WordPress)
            fastcgi_split_path_info ^(.+\.php)(/.+)$;

            # Sends the PHP request to the WordPress container on port 9000 (PHP-FPM)
            fastcgi_pass wordpress:9000;

            # Default index file for PHP
            fastcgi_index index.php;

            # Includes default FastCGI parameters
            include fastcgi_params;

            # Passes the full script path to PHP
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

            # Passes PATH_INFO information to PHP
            fastcgi_param PATH_INFO $fastcgi_path_info;
        }

        # ----------------------------
        # Location for static files (images, CSS, JS, fonts)
        # ----------------------------
        location ~* \.(?:jpg|jpeg|gif|png|ico|css|js|woff2?|ttf|svg)$ {
            # Serves the file if found, otherwise 404
            try_files $uri =404;

            # Do not log access to these files to reduce noise
            access_log off;

            # Cache the file as long as possible in the browser
            expires max;
        }

        # ----------------------------
        # Protection of sensitive files (.htaccess, etc.)
        # ----------------------------
        location ~ /\.ht {
            # Deny all access
            deny all;
        }
    }
}