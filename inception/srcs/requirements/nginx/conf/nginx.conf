# ----------------------------
# Bloc pour gérer les connexions
# ----------------------------
events {
    # Nombre maximum de connexions simultanées par worker
    worker_connections 1024;
}

# ----------------------------
# Bloc principal HTTP
# ----------------------------
http {
    # Inclut les types MIME connus pour servir les fichiers correctement
    include /etc/nginx/mime.types;
    
    # Type par défaut si le fichier n'a pas de MIME connu
    default_type application/octet-stream;

    # ----------------------------
    # Configuration du serveur
    # ----------------------------
    server {
        # Écoute sur le port 443 pour HTTPS et active HTTP/2
        listen 443 ssl http2;

        # Noms de domaine que ce serveur va gérer
        server_name dbajeux.42.fr www.dbajeux.42.fr;

        # Chemins vers le certificat SSL et sa clé
        ssl_certificate /etc/nginx/ssl/nginx.crt;
        ssl_certificate_key /etc/nginx/ssl/nginx.key;

        # Versions TLS autorisées pour la sécurité
        ssl_protocols TLSv1.2 TLSv1.3;

        # Dossier racine des fichiers du site
        root /var/www/html;

        # Fichiers index à servir par défaut si l'URL est un dossier
        index index.php index.html index.htm;

        # ----------------------------
        # Location pour la racine du site
        # ----------------------------
        location / {
            # Essaie de servir le fichier demandé
            # sinon redirige vers index.php avec les arguments (WordPress)
            try_files $uri $uri/ /index.php?$args;
        }

        # ----------------------------
        # Location pour les fichiers PHP
        # ----------------------------
        location ~ \.php$ {
            # Sépare le chemin du script et PATH_INFO (utile pour WordPress)
            fastcgi_split_path_info ^(.+\.php)(/.+)$;

            # Envoie la requête PHP au conteneur WordPress sur le port 9000 (PHP-FPM)
            fastcgi_pass wordpress:9000;

            # Fichier index par défaut pour PHP
            fastcgi_index index.php;

            # Inclut les paramètres FastCGI par défaut
            include fastcgi_params;

            # Passe le chemin complet du script à PHP
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

            # Passe les informations PATH_INFO à PHP
            fastcgi_param PATH_INFO $fastcgi_path_info;
        }

        # ----------------------------
        # Location pour les fichiers statiques (images, CSS, JS, fonts)
        # ----------------------------
        location ~* \.(?:jpg|jpeg|gif|png|ico|css|js|woff2?|ttf|svg)$ {
            # Sert le fichier si trouvé, sinon 404
            try_files $uri =404;

            # Ne pas loguer l'accès à ces fichiers pour réduire le bruit
            access_log off;

            # Cache le fichier le plus longtemps possible dans le navigateur
            expires max;
        }

        # ----------------------------
        # Protection des fichiers sensibles (.htaccess, etc.)
        # ----------------------------
        location ~ /\.ht {
            # Refuse tout accès
            deny all;
        }
    }
}

