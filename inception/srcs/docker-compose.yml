version: "3"  # Version du format Docker Compose. "3.8" est recommandé pour la compatibilité et les fonctionnalités récentes.

services:
  # === MariaDB (database layer) ===
  mariadb:
    build:
      context: ./requirements/mariadb   # Dossier contenant le Dockerfile MariaDB
    env_file: .env                      # Variables d'environnement (DB user, password, etc.)
    volumes:
      - mariadb_data:/var/lib/mysql     # Volume persistant pour stocker les données MySQL
    networks:
      - inception
    restart: unless-stopped             # Le conteneur redémarre automatiquement sauf en cas d'arrêt manuel

  # === WordPress (application layer) ===
  wordpress:
    build:
      context: ./requirements/wordpress # Dossier contenant le Dockerfile WordPress (PHP-FPM)
    env_file: .env
    volumes:
      - wordpress_data:/var/www/html    # Volume persistant pour les fichiers applicatifs WordPress
    networks:
      - inception
    depends_on:
      - mariadb                         # Démarre après MariaDB (note : ne garantit pas que la DB soit prête pour etre vraiment fiabiliser mettre en place un script)
    restart: unless-stopped

  # === NGINX (web server layer) ===
  nginx:
    build:
      context: ./requirements/nginx     # Dossier contenant le Dockerfile NGINX
    env_file: .env
    ports:
      - "443:443"                       # Expose le service HTTPS sur le port 443
    volumes:
      - wordpress_data:/var/www/html    # Accès aux fichiers WordPress pour les servir via NGINX
    networks:
      - inception
    depends_on:
      - wordpress                       # Démarre après WordPress (idem : uniquement l’ordre de lancement)
    restart: unless-stopped

# === Volumes persistants ===
volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: non
      o: bind
      device: ${SQL_DATA_PATH}          # Chemin de persistance sur l’hôte pour MariaDB

  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${WP_DATA_PATH}           # Chemin de persistance sur l’hôte pour WordPress

# === Réseau dédié à la stack ===
networks:
  inception:
     driver: bridge                   # (optionnel : "bridge" est la valeur par défaut)

